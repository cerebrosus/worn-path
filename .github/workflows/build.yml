name: Build

on:
  push:
    branches:
      - main
      - 'mc/**'
      - 'port/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'mc/**'
      - 'port/**'
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew :fabric:shadowJar

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: worn-path-fabric-26.3
          path: fabric/build/libs/*dev-shadow.jar
          if-no-files-found: error
